<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D2R Mobile · Gameplay film</title>
<meta name="description" content="Watch the complete Chinese or English D2R Mobile gameplay film.">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#eee}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:0 auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:24px;margin:0}nav{display:flex;gap:8px}button{border:1px solid #555;background:#222;color:#ddd;padding:9px 15px;border-radius:8px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#d5bb76;color:#f4dea2;background:#302819}button:focus-visible,a:focus-visible{outline:2px solid #d5bb76;outline-offset:4px}.poster img{display:block;width:100%;aspect-ratio:16/9;border-radius:10px}.watch{display:flex;flex-wrap:wrap;gap:12px}.watch a{display:inline-block;text-decoration:none;border:1px solid #75623b;border-radius:8px;padding:12px 18px;background:#302819;color:#f4dea2}p{line-height:1.65;color:#bbb;margin:14px 0}a{color:#e3c781}footer{border-top:1px solid #333;margin-top:28px;padding-top:15px;font-size:13px}#error{color:#f0b48e}@media(max-width:540px){main{padding:20px 12px}header{align-items:flex-start}h1{font-size:20px}button{padding:8px 10px}p{font-size:14px}}
</style>
</head>
<body><main>
<header><h1>D2R Mobile</h1><nav aria-label="Video language"><button type="button" id="zh" lang="zh-CN" aria-pressed="false">中文</button><button type="button" id="en" lang="en" aria-pressed="true">English</button></nav></header>
<a class="poster" id="cover" href="https://www.bilibili.com/video/BV1W7pz6CE89/"><img id="picture" src="./media/cover-zh-v2.jpg" alt="点击观看实机宣传片"></a>
<p id="caption"></p><div class="watch"><a id="youtube" href="https://www.youtube.com/watch?v=C2LDoMhCtrw">▶ YouTube</a><a id="bilibili" href="https://www.bilibili.com/video/BV1W7pz6CE89/">▶ 哔哩哔哩</a></div><p><a id="project" href="https://github.com/jhaizhou-ops/d2r-mobile"></a></p>
<footer><p id="notice"></p></footer>
</main>
<script>
const links={youtube:'https://www.youtube.com/watch?v=C2LDoMhCtrw',bilibili:'https://www.bilibili.com/video/BV1W7pz6CE89/'};
const copy={zh:{caption:'完整实机宣传片 · 1 分 36 秒。点击封面在 B 站观看，或选择 YouTube。',project:'查看开源项目与安装说明',notice:'个人非商业游戏展示，与暴雪无关。游戏版权归原权利人所有；运行项目须自备合法游戏文件。',alt:'点击在 B 站观看实机宣传片'},en:{caption:'Full gameplay film · 1 min 36 sec. Click the cover to watch on YouTube, or choose Bilibili.',project:'Open-source project and installation guide',notice:'Personal non-commercial fan demonstration, not affiliated with Blizzard Entertainment. Bring your own legally owned game files.',alt:'Click to watch the gameplay film on YouTube'}};
function select(lang){const t=copy[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title='D2R Mobile · '+(lang==='zh'?'实机宣传片':'Gameplay film');document.querySelector('nav').setAttribute('aria-label',lang==='zh'?'页面语言':'Page language');for(const name of ['caption','notice'])document.querySelector('#'+name).textContent=t[name];document.querySelector('#project').textContent=t.project;document.querySelector('#cover').href=lang==='zh'?links.bilibili:links.youtube;const image=document.querySelector('#picture');image.src='./media/cover-'+lang+'-v2.jpg';image.alt=t.alt;for(const k of ['zh','en'])document.querySelector('#'+k).setAttribute('aria-pressed',String(k===lang));const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}
for(const k of ['zh','en'])document.querySelector('#'+k).addEventListener('click',()=>select(k));const requested=new URL(location.href).searchParams.get('lang');select(requested==='zh'||requested==='en'?requested:navigator.language.toLowerCase().startsWith('zh')?'zh':'en');
</script></body></html>
